# PR validation. Runs the same lint check as the pre-commit hook, so a
# skipped or bypassed local hook can't slip through — this is the one
# that's actually required by branch protection.
name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint infra
        working-directory: infra
        run: npm run lint

      - name: Build infra
        working-directory: infra
        run: npm run build

      - name: Lint web
        working-directory: web
        run: npm run lint

      # No VITE_* env vars needed to catch type errors / bundling issues —
      # see web/src/lib/config.ts, which only reads them at runtime.
      - name: Build web
        working-directory: web
        run: npm run build
