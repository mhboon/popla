# Deploys the CDK app on every push to main.
#
# AWS auth uses GitHub OIDC (see infra/lib/github-oidc-stack.ts) — no
# long-lived AWS access keys are stored in this repo or as secrets. The
# only account-specific value involved, the deploy role's ARN, lives ONLY
# as the AWS_DEPLOY_ROLE_ARN repo secret below. That matters beyond just
# "not committed": because it's registered as a GitHub secret, GitHub
# automatically redacts its value — including the AWS account ID embedded
# in it — from this workflow's log output, even output produced by `cdk
# deploy` itself (which otherwise prints stack/resource ARNs containing
# the account ID). Do not echo secrets. or otherwise print the account ID
# directly; that would defeat the masking.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # AWS_DEPLOY_ROLE_ARN / AWS_REGION only exist once the one-time OIDC
      # bootstrap in README.md has been done (see infra/lib/github-oidc-stack.ts).
      # Until then, every later step is skipped rather than failing the
      # job — this is expected on a fresh clone/fork, not a broken pipeline.
      - name: Check AWS deploy configuration
        id: check
        run: |
          if [ -n "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ] && [ -n "${{ vars.AWS_REGION }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            MSG="AWS_DEPLOY_ROLE_ARN secret and/or AWS_REGION variable are not set — skipping deploy. See README.md's 'CI/CD setup (one-time)' section."
            echo "::notice::$MSG"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        if: steps.check.outputs.configured == 'true'

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      - name: Configure AWS credentials
        if: steps.check.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy backend stack
        if: steps.check.outputs.configured == 'true'
        working-directory: infra
        run: npx cdk deploy PoplaBackendStack --require-approval never --outputs-file cdk-outputs.json

      - name: Read backend outputs
        if: steps.check.outputs.configured == 'true'
        id: backend-outputs
        working-directory: infra
        run: echo "json=$(jq -c . cdk-outputs.json)" >> "$GITHUB_OUTPUT"

      # Bakes the backend's AppSync/Cognito endpoints into the static
      # bundle at build time (see web/src/lib/config.ts) — none of these
      # values are account-specific (see infra/lib/backend-stack.ts).
      - name: Build frontend
        if: steps.check.outputs.configured == 'true'
        working-directory: web
        run: npm run build
        env:
          VITE_APPSYNC_URL: ${{ fromJson(steps.backend-outputs.outputs.json).PoplaBackendStack.ApiUrl }}
          VITE_USER_POOL_ID: ${{ fromJson(steps.backend-outputs.outputs.json).PoplaBackendStack.UserPoolId }}
          VITE_USER_POOL_CLIENT_ID: ${{ fromJson(steps.backend-outputs.outputs.json).PoplaBackendStack.UserPoolClientId }}

      - name: Deploy web stack
        if: steps.check.outputs.configured == 'true'
        working-directory: infra
        run: npx cdk deploy PoplaWebStack --require-approval never
