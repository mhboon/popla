# Deploys the CDK app on every push to main.
#
# AWS auth uses GitHub OIDC (see infra/lib/github-oidc-stack.ts) — no
# long-lived AWS access keys are stored in this repo or as secrets. The
# only account-specific value involved, the deploy role's ARN, lives ONLY
# as the AWS_DEPLOY_ROLE_ARN repo secret below. That matters beyond just
# "not committed": because it's registered as a GitHub secret, GitHub
# automatically redacts its value — including the AWS account ID embedded
# in it — from this workflow's log output, even output produced by `cdk
# deploy` itself (which otherwise prints stack/resource ARNs containing
# the account ID). Do not echo secrets. or otherwise print the account ID
# directly; that would defeat the masking.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # AWS_DEPLOY_ROLE_ARN / AWS_REGION only exist once the one-time OIDC
      # bootstrap in README.md has been done (see infra/lib/github-oidc-stack.ts).
      # Until then, every later step is skipped rather than failing the
      # job — this is expected on a fresh clone/fork, not a broken pipeline.
      - name: Check AWS deploy configuration
        id: check
        run: |
          if [ -n "${{ secrets.AWS_DEPLOY_ROLE_ARN }}" ] && [ -n "${{ vars.AWS_REGION }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            MSG="AWS_DEPLOY_ROLE_ARN secret and/or AWS_REGION variable are not set — skipping deploy. See README.md's 'CI/CD setup (one-time)' section."
            echo "::notice::$MSG"
            echo "$MSG" >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/checkout@v4
        if: steps.check.outputs.configured == 'true'

      - uses: actions/setup-node@v4
        if: steps.check.outputs.configured == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        if: steps.check.outputs.configured == 'true'
        run: npm ci

      - name: Configure AWS credentials
        if: steps.check.outputs.configured == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy backend stack
        if: steps.check.outputs.configured == 'true'
        working-directory: infra
        run: npx cdk deploy PoplaBackendStack --require-approval never

      - name: Deploy web stack
        if: steps.check.outputs.configured == 'true'
        working-directory: infra
        run: npx cdk deploy PoplaWebStack --require-approval never
