enum MatchdayFormat {
  MEXICANO
  AMERICANO
}

enum SeasonStatus {
  ACTIVE
  CLOSED
}

enum MatchdayStatus {
  REGISTRATION
  SETUP
  IN_PROGRESS
  CLOSED
}

enum MatchStatus {
  PENDING
  COMPLETE
}

enum ParticipationStatus {
  JOINING
  WAITLISTED
  DECLINED
}

type Player {
  playerId: ID!
  displayName: String!
  # Admin-only: a non-admin caller (participant) resolves these to null
  # rather than an error, since both are nullable — see SPEC.md/
  # ARCHITECTURE.md's Auth section. This lets listPlayers stay open to
  # any authenticated user for playerId -> displayName resolution
  # without leaking other participants' contact info.
  phone: String @aws_auth(cognito_groups: ["Admins"])
  email: String @aws_auth(cognito_groups: ["Admins"])
  # Computed (phone == null), not stored — unlike phone/email itself this
  # reveals no PII, so it's readable by any authenticated caller. Lets a
  # non-admin participant see a "Guest" badge in matchday rosters/rankings
  # without needing the phone-gated fields.
  isGuest: Boolean!
  createdAt: AWSDateTime!
}

type Season {
  seasonId: ID!
  name: String!
  status: SeasonStatus!
  startDate: AWSDate!
  closedAt: AWSDateTime
}

type Matchday {
  matchdayId: ID!
  seasonId: ID!
  date: AWSDate!
  # Optional time-of-day the matchday starts. Kept separate from `date`
  # (rather than widening date to AWSDateTime) so existing matchdays
  # don't need a data migration — AppSync's AWSDateTime scalar validates
  # format on read too, and pre-existing rows only have a plain date.
  startTime: AWSTime
  format: MatchdayFormat!
  status: MatchdayStatus!
  # Only set for matchdays created via openRegistration — null for the
  # legacy direct-to-SETUP createMatchday path. Left in place (not
  # cleared) after registration closes, as a historical "16 of 16" record.
  maxParticipants: Int
  joinedCount: Int
}

type MatchdayParticipant {
  matchdayId: ID!
  playerId: ID!
  status: ParticipationStatus!
}

type Match {
  matchdayId: ID!
  round: Int!
  court: Int!
  team1PlayerIds: [ID!]!
  team2PlayerIds: [ID!]!
  team1Games: Int
  team2Games: Int
  status: MatchStatus!
}

type MatchdayResult {
  matchdayId: ID!
  playerId: ID!
  setsWon: Int!
  gamesWon: Int!
  gamesLost: Int!
  gameDiff: Int!
  rank: Int!
  seasonPoints: Int!
  # Whether this player earned a winner point ("streepje") for this
  # matchday — see SPEC.md's Winner Points.
  winnerPoint: Boolean!
}

type SeasonStanding {
  seasonId: ID!
  playerId: ID!
  totalPoints: Int!
  matchdaysPlayed: Int!
  # Sum of winner points earned across this season's closed matchdays —
  # see SPEC.md's Winner Points.
  winnerPoints: Int!
}

# Any authenticated Cognito user (admin or participant — see
# ARCHITECTURE.md's Auth section) can call any Query field by default,
# since login itself now implies "at least read access". The only
# PII on this graph, Player.phone/email, is gated at the field level
# instead (see the Player type above), so listPlayers stays usable by
# everyone for playerId -> displayName resolution.
type Query {
  listPlayers: [Player!]!
  # The Player linked to the caller's own login (matched by Cognito
  # Username == phone number — see ARCHITECTURE.md's Auth section), or
  # null for a bare console admin with no linked Player. Lets the
  # frontend find "my own" row in a matchday roster without needing the
  # phone-gated listPlayers fields.
  getMyPlayer: Player
  listSeasons: [Season!]!
  getSeason(seasonId: ID!): Season
  listMatchdaysBySeason(seasonId: ID!): [Matchday!]!
  getMatchday(matchdayId: ID!): Matchday
  listMatchdayParticipantIds(matchdayId: ID!): [ID!]!
  # Full RSVP roster (including WAITLISTED/DECLINED) for a matchday still
  # in REGISTRATION. A row with no stored `status` (every row written by
  # createMatchday/updateMatchday, i.e. every SETUP+ matchday) reads as
  # JOINING.
  listMatchdayParticipants(matchdayId: ID!): [MatchdayParticipant!]!
  listMatches(matchdayId: ID!): [Match!]!
  getMatchdayRanking(matchdayId: ID!): [MatchdayResult!]!
  getSeasonStanding(seasonId: ID!): [SeasonStanding!]!
  getSeasonWinnerRanking(seasonId: ID!): [SeasonStanding!]!

  # Admin-management UI data — the Cognito Usernames (phone numbers, by
  # construction — see ARCHITECTURE.md's Auth section) currently in the
  # Admins group. Not participant-facing, so this one keeps an explicit
  # field-level restriction even though Query is open by default above.
  listAdminPhoneNumbers: [String!]! @aws_auth(cognito_groups: ["Admins"])
}

type Mutation {
  createPlayer(displayName: String!, phone: String, email: String): Player!
    @aws_auth(cognito_groups: ["Admins"])

  updatePlayer(
    playerId: ID!
    displayName: String
    phone: String
    email: String
  ): Player! @aws_auth(cognito_groups: ["Admins"])

  createSeason(name: String!, startDate: AWSDate!): Season!
    @aws_auth(cognito_groups: ["Admins"])

  closeSeason(seasonId: ID!): Season!
    @aws_auth(cognito_groups: ["Admins"])

  reopenSeason(seasonId: ID!): Season!
    @aws_auth(cognito_groups: ["Admins"])

  createMatchday(
    seasonId: ID!
    date: AWSDate!
    startTime: AWSTime
    format: MatchdayFormat!
    participantIds: [ID!]!
  ): Matchday! @aws_auth(cognito_groups: ["Admins"])

  # Opens a matchday for self-service RSVP instead of createMatchday's
  # up-front fixed list — see setMatchdayJoining/closeRegistration below.
  openRegistration(
    seasonId: ID!
    date: AWSDate!
    startTime: AWSTime
    format: MatchdayFormat!
    maxParticipants: Int!
  ): Matchday! @aws_auth(cognito_groups: ["Admins"])

  # Sets the caller's own RSVP (omit playerId) or — admin only — another
  # player's (e.g. a guest, who has no login to self-serve with). Only
  # valid while the matchday is REGISTRATION. Joining past maxParticipants
  # waitlists instead of failing; leaving a confirmed spot auto-promotes
  # the longest-waiting waitlisted player. Not @aws_auth-restricted at the
  # field level — the Lambda itself enforces that a non-admin caller can
  # only ever target their own player.
  setMatchdayJoining(matchdayId: ID!, playerId: ID, joining: Boolean!): MatchdayParticipant!

  # Locks in the roster (every still-JOINING player; WAITLISTED/DECLINED
  # rows are dropped) and moves the matchday from REGISTRATION to SETUP,
  # same precondition as createMatchday: a non-zero multiple of 4.
  closeRegistration(matchdayId: ID!): Matchday!
    @aws_auth(cognito_groups: ["Admins"])

  # Only allowed while the matchday is still SETUP (before generateRound
  # has created round 1) — editing date/format/participants after play has
  # started would leave already-generated Matches inconsistent.
  updateMatchday(
    matchdayId: ID!
    date: AWSDate
    startTime: AWSTime
    format: MatchdayFormat
    participantIds: [ID!]
  ): Matchday! @aws_auth(cognito_groups: ["Admins"])

  # Generates the next round (1 + the highest round already generated for
  # this matchday, or 1 if none yet) — the caller doesn't pick a round
  # number, since there's no fixed round count (see SPEC.md).
  generateRound(matchdayId: ID!): [Match!]!
    @aws_auth(cognito_groups: ["Admins"])

  recordSetResult(
    matchdayId: ID!
    round: Int!
    court: Int!
    team1Games: Int!
    team2Games: Int!
  ): Match! @aws_auth(cognito_groups: ["Admins"])

  closeMatchday(matchdayId: ID!): Matchday!
    @aws_auth(cognito_groups: ["Admins"])

  # Grants Admins-group membership to a player's existing Cognito user
  # (requires the player to already have phone-based login enabled, i.e.
  # a non-null cognitoSub — see ARCHITECTURE.md's Auth section).
  promoteToAdmin(playerId: ID!): Boolean!
    @aws_auth(cognito_groups: ["Admins"])

  # Revokes Admins-group membership. Rejects removing the caller's own
  # admin status (see ARCHITECTURE.md) — use another admin account, or
  # the AWS console, to do that.
  demoteFromAdmin(playerId: ID!): Boolean!
    @aws_auth(cognito_groups: ["Admins"])
}

schema {
  query: Query
  mutation: Mutation
}
