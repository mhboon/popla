enum MatchdayFormat {
  MEXICANO
  AMERICANO
}

enum SeasonStatus {
  ACTIVE
  CLOSED
}

enum MatchdayStatus {
  SETUP
  IN_PROGRESS
  CLOSED
}

enum MatchStatus {
  PENDING
  COMPLETE
}

type Player {
  playerId: ID!
  displayName: String!
  # Admin-only: a non-admin caller (participant) resolves these to null
  # rather than an error, since both are nullable — see SPEC.md/
  # ARCHITECTURE.md's Auth section. This lets listPlayers stay open to
  # any authenticated user for playerId -> displayName resolution
  # without leaking other participants' contact info.
  phone: String @aws_auth(cognito_groups: ["Admins"])
  email: String @aws_auth(cognito_groups: ["Admins"])
  createdAt: AWSDateTime!
}

type Season {
  seasonId: ID!
  name: String!
  status: SeasonStatus!
  startDate: AWSDate!
  closedAt: AWSDateTime
}

type Matchday {
  matchdayId: ID!
  seasonId: ID!
  date: AWSDate!
  # Optional time-of-day the matchday starts. Kept separate from `date`
  # (rather than widening date to AWSDateTime) so existing matchdays
  # don't need a data migration — AppSync's AWSDateTime scalar validates
  # format on read too, and pre-existing rows only have a plain date.
  startTime: AWSTime
  format: MatchdayFormat!
  status: MatchdayStatus!
}

type Match {
  matchdayId: ID!
  round: Int!
  court: Int!
  team1PlayerIds: [ID!]!
  team2PlayerIds: [ID!]!
  team1Games: Int
  team2Games: Int
  status: MatchStatus!
}

type MatchdayResult {
  matchdayId: ID!
  playerId: ID!
  setsWon: Int!
  gamesWon: Int!
  gamesLost: Int!
  gameDiff: Int!
  rank: Int!
  seasonPoints: Int!
  # Whether this player earned a winner point ("streepje") for this
  # matchday — see SPEC.md's Winner Points.
  winnerPoint: Boolean!
}

type SeasonStanding {
  seasonId: ID!
  playerId: ID!
  totalPoints: Int!
  matchdaysPlayed: Int!
  # Sum of winner points earned across this season's closed matchdays —
  # see SPEC.md's Winner Points.
  winnerPoints: Int!
}

# Any authenticated Cognito user (admin or participant — see
# ARCHITECTURE.md's Auth section) can call any Query field by default,
# since login itself now implies "at least read access". The only
# PII on this graph, Player.phone/email, is gated at the field level
# instead (see the Player type above), so listPlayers stays usable by
# everyone for playerId -> displayName resolution.
type Query {
  listPlayers: [Player!]!
  listSeasons: [Season!]!
  getSeason(seasonId: ID!): Season
  listMatchdaysBySeason(seasonId: ID!): [Matchday!]!
  getMatchday(matchdayId: ID!): Matchday
  listMatchdayParticipantIds(matchdayId: ID!): [ID!]!
  listMatches(matchdayId: ID!): [Match!]!
  getMatchdayRanking(matchdayId: ID!): [MatchdayResult!]!
  getSeasonStanding(seasonId: ID!): [SeasonStanding!]!
  getSeasonWinnerRanking(seasonId: ID!): [SeasonStanding!]!

  # Admin-management UI data — the Cognito Usernames (phone numbers, by
  # construction — see ARCHITECTURE.md's Auth section) currently in the
  # Admins group. Not participant-facing, so this one keeps an explicit
  # field-level restriction even though Query is open by default above.
  listAdminPhoneNumbers: [String!]! @aws_auth(cognito_groups: ["Admins"])
}

type Mutation {
  createPlayer(displayName: String!, phone: String, email: String): Player!
    @aws_auth(cognito_groups: ["Admins"])

  updatePlayer(
    playerId: ID!
    displayName: String
    phone: String
    email: String
  ): Player! @aws_auth(cognito_groups: ["Admins"])

  createSeason(name: String!, startDate: AWSDate!): Season!
    @aws_auth(cognito_groups: ["Admins"])

  closeSeason(seasonId: ID!): Season!
    @aws_auth(cognito_groups: ["Admins"])

  reopenSeason(seasonId: ID!): Season!
    @aws_auth(cognito_groups: ["Admins"])

  createMatchday(
    seasonId: ID!
    date: AWSDate!
    startTime: AWSTime
    format: MatchdayFormat!
    participantIds: [ID!]!
  ): Matchday! @aws_auth(cognito_groups: ["Admins"])

  # Only allowed while the matchday is still SETUP (before generateRound
  # has created round 1) — editing date/format/participants after play has
  # started would leave already-generated Matches inconsistent.
  updateMatchday(
    matchdayId: ID!
    date: AWSDate
    startTime: AWSTime
    format: MatchdayFormat
    participantIds: [ID!]
  ): Matchday! @aws_auth(cognito_groups: ["Admins"])

  # Generates the next round (1 + the highest round already generated for
  # this matchday, or 1 if none yet) — the caller doesn't pick a round
  # number, since there's no fixed round count (see SPEC.md).
  generateRound(matchdayId: ID!): [Match!]!
    @aws_auth(cognito_groups: ["Admins"])

  recordSetResult(
    matchdayId: ID!
    round: Int!
    court: Int!
    team1Games: Int!
    team2Games: Int!
  ): Match! @aws_auth(cognito_groups: ["Admins"])

  closeMatchday(matchdayId: ID!): Matchday!
    @aws_auth(cognito_groups: ["Admins"])

  # Grants Admins-group membership to a player's existing Cognito user
  # (requires the player to already have phone-based login enabled, i.e.
  # a non-null cognitoSub — see ARCHITECTURE.md's Auth section).
  promoteToAdmin(playerId: ID!): Boolean!
    @aws_auth(cognito_groups: ["Admins"])

  # Revokes Admins-group membership. Rejects removing the caller's own
  # admin status (see ARCHITECTURE.md) — use another admin account, or
  # the AWS console, to do that.
  demoteFromAdmin(playerId: ID!): Boolean!
    @aws_auth(cognito_groups: ["Admins"])
}

schema {
  query: Query
  mutation: Mutation
}
